name: Convert MRS Ruleset

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'yaml/**'

permissions:
  contents: write

env:
  MIHOMO_VERSION: "v1.19.31"

jobs:
  convert-ruleset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set current datetime
        run: |
          echo "update_time=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S UTC+8')" >> "$GITHUB_ENV"

      - name: Download and setup mihomo
        run: |
          set -e

          curl -L \
            -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${{ env.MIHOMO_VERSION }}/mihomo-linux-amd64-v3-${{ env.MIHOMO_VERSION }}.gz"

          gzip -d mihomo.gz
          chmod +x ./mihomo

          ./mihomo -v

          mkdir -p ./mrs
          mkdir -p ./tmp_rules

      - name: Convert yaml files to mrs
        shell: bash
        run: |
          set -euo pipefail

          # 每次重新生成，避免旧的 mrs 文件残留
          rm -f ./mrs/*.mrs

          for yaml_file in ./yaml/*.yaml; do
            [ -f "$yaml_file" ] || continue

            filename=$(basename "$yaml_file" .yaml)

            echo ""
            echo "========================================"
            echo "Processing: $yaml_file"
            echo "========================================"

            DOMAIN_TMP="./tmp_rules/${filename}_domain.yaml"
            IPCIDR_TMP="./tmp_rules/${filename}_ipcidr.yaml"

            echo "payload:" > "$DOMAIN_TMP"
            echo "payload:" > "$IPCIDR_TMP"

            domain_count=0
            ip_count=0

            #
            # 提取 payload 中的规则
            #
            while IFS= read -r line; do

              # 去掉前面的 "- "
              rule=$(echo "$line" | sed -E 's/^[[:space:]]*-[[:space:]]*//')

              # 去掉首尾空格
              rule=$(echo "$rule" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')

              # 去掉最外层单/双引号
              rule=$(echo "$rule" | sed -E "s/^['\"]//; s/['\"]$//")

              # 跳过空行和注释
              [ -z "$rule" ] && continue
              [[ "$rule" =~ ^# ]] && continue

              #
              # IP-CIDR
              #
              if [[ "$rule" =~ ^IP-CIDR, ]]; then

                cidr="${rule#IP-CIDR,}"

                # 去掉可能存在的 no-resolve 等附加字段
                cidr="${cidr%%,*}"

                echo "  - '$cidr'" >> "$IPCIDR_TMP"
                ip_count=$((ip_count + 1))

              #
              # IP-CIDR6
              #
              elif [[ "$rule" =~ ^IP-CIDR6, ]]; then

                cidr="${rule#IP-CIDR6,}"
                cidr="${cidr%%,*}"

                echo "  - '$cidr'" >> "$IPCIDR_TMP"
                ip_count=$((ip_count + 1))

              #
              # 裸 IPv4 CIDR
              #
              elif [[ "$rule" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$ ]]; then

                echo "  - '$rule'" >> "$IPCIDR_TMP"
                ip_count=$((ip_count + 1))

              #
              # IPv6 CIDR
              #
              elif [[ "$rule" == *:* && "$rule" == */* ]]; then

                echo "  - '$rule'" >> "$IPCIDR_TMP"
                ip_count=$((ip_count + 1))

              #
              # DOMAIN
              #
              elif [[ "$rule" =~ ^DOMAIN, ]]; then

                value="${rule#DOMAIN,}"
                value="${value%%,*}"

                # domain behavior 精确域名
                echo "  - '$value'" >> "$DOMAIN_TMP"
                domain_count=$((domain_count + 1))

              #
              # DOMAIN-SUFFIX
              #
              elif [[ "$rule" =~ ^DOMAIN-SUFFIX, ]]; then

                value="${rule#DOMAIN-SUFFIX,}"
                value="${value%%,*}"

                echo "  - '+.$value'" >> "$DOMAIN_TMP"
                domain_count=$((domain_count + 1))

              #
              # DOMAIN-KEYWORD
              #
              elif [[ "$rule" =~ ^DOMAIN-KEYWORD, ]]; then

                value="${rule#DOMAIN-KEYWORD,}"
                value="${value%%,*}"

                echo "  - 'keyword:$value'" >> "$DOMAIN_TMP"
                domain_count=$((domain_count + 1))

              #
              # 已经是 domain behavior 格式
              #
              else

                echo "  - '$rule'" >> "$DOMAIN_TMP"
                domain_count=$((domain_count + 1))

              fi

            done < <(grep -E '^[[:space:]]*-' "$yaml_file" || true)

            echo "Domain rules : $domain_count"
            echo "IPCIDR rules : $ip_count"

            #
            # 只有域名
            #
            if [ "$domain_count" -gt 0 ] && [ "$ip_count" -eq 0 ]; then

              echo "Detected type: DOMAIN"

              ./mihomo convert-ruleset \
                domain \
                yaml \
                "$DOMAIN_TMP" \
                "./mrs/${filename}.mrs"

            #
            # 只有 IP
            #
            elif [ "$ip_count" -gt 0 ] && [ "$domain_count" -eq 0 ]; then

              echo "Detected type: IPCIDR"

              ./mihomo convert-ruleset \
                ipcidr \
                yaml \
                "$IPCIDR_TMP" \
                "./mrs/${filename}.mrs"

            #
            # 混合规则
            #
            elif [ "$domain_count" -gt 0 ] && [ "$ip_count" -gt 0 ]; then

              echo "Detected type: MIXED"
              echo "Splitting into DOMAIN + IPCIDR"

              #
              # 为兼容原来的 URL：
              # domain 仍然保持 filename.mrs
              #
              ./mihomo convert-ruleset \
                domain \
                yaml \
                "$DOMAIN_TMP" \
                "./mrs/${filename}.mrs"

              #
              # IP 规则额外生成
              #
              ./mihomo convert-ruleset \
                ipcidr \
                yaml \
                "$IPCIDR_TMP" \
                "./mrs/${filename}_ipcidr.mrs"

            else

              echo "::warning file=$yaml_file::No valid rules found"

            fi

          done

      - name: Verify generated mrs files
        run: |
          echo ""
          echo "Generated MRS files:"
          echo "========================================"

          if ! compgen -G "./mrs/*.mrs" > /dev/null; then
            echo "No MRS files generated!"
            exit 1
          fi

          ls -lh ./mrs/

      - name: Create release body
        run: |
          cat > release_body.md << EOF
          自动转换自定义 YAML 格式规则集到 MRS 格式规则集

          生成时间: ${{ env.update_time }}

          包含以下规则集文件:

          EOF

          for file in ./mrs/*.mrs; do
            [ -f "$file" ] || continue
            echo "- $(basename "$file")" >> release_body.md
          done

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ruleset-latest
          name: "Custom Mihomo Ruleset"
          body_path: release_body.md
          files: ./mrs/*.mrs
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated rulesets
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add ./mrs/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto convert yaml ruleset to mrs ruleset - ${{ env.update_time }}"
            git push origin HEAD:main
          fi
